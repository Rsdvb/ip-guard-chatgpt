appId: com.ip-guard.desktop
productName: IP Guard
asar: true
npmRebuild: false
directories:
  output: release
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
extraResources:
  - from: ../browser-extension/dist
    to: browser-extension
  - from: assets
    to: assets
  - from: dist/release-info.json
    to: release-info.json
win:
  extraResources:
    - from: dist/native/${version}
      to: native/${version}
    - from: dist/recover.cmd
      to: recover.cmd
  icon: assets/icon.ico
  requestedExecutionLevel: requireAdministrator
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  include: scripts/installer.nsh
  artifactName: IP-Guard-Setup-${version}.${ext}
mac:
  extraResources:
    - from: posix
      to: posix
    - from: mac
      to: mac-source
    - from: dist/mac
      to: mac-build
  identity: "-"
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  category: public.app-category.utilities
  target:
    - target: zip
      arch: [arm64]
  artifactName: IP-Guard-${version}-macOS-${arch}.${ext}
linux:
  extraResources:
    - from: posix
      to: posix
  category: Utility
  target:
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  artifactName: IP-Guard-${version}-Ubuntu-${arch}.${ext}
  maintainer: IP Guard Contributors
