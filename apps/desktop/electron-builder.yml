appId: com.ip-guard.desktop
productName: IP Guard
extraMetadata:
  name: ip-guard
asar: true
npmRebuild: false
directories:
  output: release
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
extraResources:
  - from: ../browser-extension/dist
    to: browser-extension
  - from: assets
    to: assets
  - from: dist/release-info.json
    to: release-info.json
win:
  extraResources:
    - from: dist/native/${version}
      to: native/${version}
    - from: dist/recover.cmd
      to: recover.cmd
  icon: assets/icon.ico
  requestedExecutionLevel: requireAdministrator
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  include: scripts/installer.nsh
  artifactName: IP-Guard-Setup-${version}.${ext}
mac:
  extraResources:
    - from: posix
      to: posix
    - from: mac
      to: mac-source
    - from: dist/mac
      to: mac-build
  identity: "-"
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  category: public.app-category.utilities
  target:
    - target: zip
      arch: [arm64]
  artifactName: IP-Guard-${version}-macOS-${arch}.${ext}
linux:
  executableName: ip-guard
  extraResources:
    - from: posix
      to: posix
    - from: dist/linux
      to: linux-native
      filter: [ipguard-system]
    - from: linux
      to: linux-source
  category: Utility
  target:
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  artifactName: IP-Guard-${version}-Ubuntu-${arch}.${ext}
  maintainer: Rsdvb <64085433+Rsdvb@users.noreply.github.com>
deb:
  afterInstall: dist/linux/after-install.tpl
  afterRemove: dist/linux/after-remove.tpl
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - policykit-1
    - systemd
