name: Three-platform validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CI: true
      E2E_TEST_PORT: 3265
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: actions/setup-go@v5
        if: runner.os == 'Linux'
        with:
          go-version: 1.27.3
          cache-dependency-path: apps/desktop/linux/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Browser test runtime
        run: pnpm --filter @ip-guard/web exec playwright install --with-deps chromium
      - name: Ubuntu user cgroup session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Check, build and real OS process tests
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vp run ready 2>&1 | tee posix-validation.log
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})' > platform.json
      - name: Build preview packages
        run: pnpm exec vp run package:desktop
      - name: Start installed Ubuntu desktop and native host
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y ./apps/desktop/release/*.deb
          binary=$(command -v ip-guard)
          test -n "$binary" && test -f "$binary" && test -x "$binary"
          export IP_GUARD_PACKAGED_EXECUTABLE="$binary"
          xvfb-run -a node apps/web/tests/platform/desktop-smoke.ts 2>&1 | tee packaged-validation.log
      - name: Installed Ubuntu system service, upgrade and GUI policy acknowledgement
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          uid=$(id -u)
          printf '{"action":"policy","policy":{"format":1,"uid":%s,"targets":[]}}' "$uid" | sudo env PKEXEC_UID="$uid" /usr/lib/ipguard/ipguard-system enable "$uid"
          sudo systemctl is-active "ipguard@$uid.service"
          sudo apt-get install --reinstall -y ./apps/desktop/release/*.deb
          sudo systemctl is-active "ipguard@$uid.service"
          export IP_GUARD_PACKAGED_EXECUTABLE="$(command -v ip-guard)"
          IP_GUARD_EXPECT_SYSTEM=1 xvfb-run -a node apps/web/tests/platform/desktop-smoke.ts 2>&1 | tee system-service-validation.log
          mv packaged-smoke.json system-packaged-smoke.json
          mv cold-tray-smoke.json system-cold-tray-smoke.json
          sudo systemctl show "ipguard@$uid.service" -p MemoryCurrent -p CPUUsageNSec >> system-service-validation.log
          sudo apt-get remove -y ip-guard
          test ! -e /usr/lib/ipguard/ipguard-system
          test ! -e /etc/systemd/system/ipguard@.service
      - name: Start packaged Windows desktop and native host
        if: runner.os == 'Windows'
        env:
          DEBUG: pw:browser
        shell: bash
        run: node apps/web/tests/platform/desktop-smoke.ts 2>&1 | tee packaged-validation.log
      - name: Start packaged Apple Silicon desktop and native host
        if: runner.os == 'macOS'
        shell: bash
        run: node apps/web/tests/platform/desktop-smoke.ts 2>&1 | tee packaged-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ip-guard-${{ matrix.os }}
          retention-days: 14
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.deb
            apps/desktop/release/*.tar.gz
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
            apps/web/test-results
            posix-validation.log
            platform.json
            packaged-smoke.json
            cold-tray-smoke.json
            system-packaged-smoke.json
            system-cold-tray-smoke.json
            system-service-validation.log
            packaged-validation.log
